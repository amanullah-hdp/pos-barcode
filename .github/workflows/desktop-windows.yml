name: Desktop Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build app
        run: npm run build

      - name: Stage desktop pack
        run: node scripts/prepare-desktop-pack.mjs

      - name: Build Electron main
        run: npm run build:main -w barcode-pos-desktop

      - name: Create NSIS installer
        run: npm run pack:win -w barcode-pos-desktop

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BarcodePOS-Setup-windows
          path: desktop/release/*.exe
