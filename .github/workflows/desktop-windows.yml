name: Desktop Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build app
        run: npm run build

      - name: Stage desktop pack
        env:
          DESKTOP_PACK_PLATFORM: win32
          DESKTOP_PACK_ARCH: x64
        run: node scripts/prepare-desktop-pack.mjs

      - name: Build Electron main
        run: npm run build:main -w barcode-pos-desktop

      - name: Create NSIS installer
        run: npm run pack:win -w barcode-pos-desktop

      - name: Upload installer (Actions artifact — requires GitHub login)
        uses: actions/upload-artifact@v4
        with:
          name: BarcodePOS-Setup-windows
          path: desktop/release/*.exe

      # Releases are public download links; Actions artifacts need a signed-in GitHub account.
      - name: Publish installer to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXE=(desktop/release/*.exe)
          if [ ! -f "${EXE[0]}" ]; then
            echo "No installer found under desktop/release/"
            exit 1
          fi
          TAG=desktop-win-latest
          TITLE="Barcode POS — Windows installer (latest)"
          NOTES="Automated build from workflow run ${GITHUB_RUN_ID} (${GITHUB_SHA:0:7}).\n\nUse this page to install on shop PCs without signing into GitHub Actions."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" "${EXE[@]}" --repo "$GITHUB_REPOSITORY" --clobber
